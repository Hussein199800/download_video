name: تدفّق — اختبار وبناء

on:
  push:
    paths: ['tadaffuq/**', '.github/workflows/tadaffuq.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tadaffuq
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Engine tests
        run: chmod +x gradlew && ./gradlew :engine:test --no-daemon
      - name: App tests (Robolectric)
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tadaffuq-apk
          path: |
            tadaffuq/app/build/outputs/apk/debug/*.apk
            tadaffuq/app/build/outputs/apk/release/*.apk
