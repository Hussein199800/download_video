apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// مفتاح التوقيع يُقرأ من android/keystore.properties أو من متغيرات البيئة، ولا يُرفع إلى المستودع أبداً
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }
def signingValue = { String key, String env -> keystoreProps.getProperty(key) ?: System.getenv(env) }

// ملف APK لكل معالج لتصغير الحجم؛ رقم البناء = versionCode×10 + رقم المعالج
def abiCodes = ['armeabi-v7a': 1, 'arm64-v8a': 2]

android {
    namespace = "com.sayl.downloader"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.sayl.downloader"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (signingValue('storeFile', 'SAYL_KEYSTORE')) {
                storeFile file(signingValue('storeFile', 'SAYL_KEYSTORE'))
                storePassword signingValue('storePassword', 'SAYL_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'SAYL_KEY_ALIAS') ?: 'sayl'
                keyPassword signingValue('keyPassword', 'SAYL_KEY_PASSWORD') ?: signingValue('storePassword', 'SAYL_KEYSTORE_PASSWORD')
            }
        }
    }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }
    packagingOptions {
        // مكتبات yt-dlp وبايثون وFFmpeg تُفك من الحزمة عند التثبيت
        jniLibs { useLegacyPackaging = true }
    }
    compileOptions {
        // NewPipe Extractor يحتاج java.nio تحت أندرويد 13
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildTypes {
        release {
            if (signingValue('storeFile', 'SAYL_KEYSTORE')) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

android.applicationVariants.configureEach { variant ->
    variant.outputs.each { output ->
        def abi = output.getFilter(com.android.build.OutputFile.ABI)
        if (abi != null) output.versionCodeOverride = variant.versionCode * 10 + abiCodes.get(abi)
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // محرّك التنزيل: yt-dlp وبايثون وFFmpeg وaria2c
    implementation "io.github.junkfood02.youtubedl-android:library:0.18.1"
    implementation "io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1"
    implementation "io.github.junkfood02.youtubedl-android:aria2c:0.18.1"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs_nio:2.1.5"
    // الطابور يعمل في الخلفية والتطبيق مغلق
    implementation "androidx.work:work-runtime:2.10.5"
    // org.json الحقيقية لاختبارات JVM (نسخة أندرويد في اختبارات الوحدة مجرد هياكل فارغة)
    testImplementation "org.json:json:20240303"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
